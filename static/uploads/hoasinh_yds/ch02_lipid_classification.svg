<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%" height="100%">
  <rect width="800" height="360" fill="#0f172a" rx="16"/>
  <text x="400" y="36" fill="#f59e0b" font-size="20" font-weight="bold" text-anchor="middle" font-family="sans-serif">HÓA HỌC LIPID: CẤU TRÚC PHOSPHOLIPID &amp; CHOLESTEROL</text>
  
  <g transform="translate(60, 70)">
    <rect width="320" height="240" fill="#1e293b" rx="12" stroke="#f59e0b" stroke-width="2"/>
    <text x="160" y="32" fill="#fbbf24" font-size="16" font-weight="bold" text-anchor="middle" font-family="sans-serif">Phosphatidylcholine (Lecithin)</text>
    <!-- Head -->
    <circle cx="80" cy="110" r="32" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
    <text x="80" y="115" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">Choline + PO4</text>
    <text x="80" y="160" fill="#7dd3fc" font-size="11" text-anchor="middle">Đầu ưa nước (Hydrophilic)</text>
    <!-- Tails -->
    <path d="M 140,95 Q 190,95 240,90 Q 270,95 290,90" fill="none" stroke="#f43f5e" stroke-width="4"/>
    <path d="M 140,125 Q 190,125 210,145 Q 240,135 290,140" fill="none" stroke="#f43f5e" stroke-width="4"/>
    <text x="210" y="180" fill="#fda4af" font-size="12" text-anchor="middle">2 Đuôi Hydrocacbon Kỵ nước</text>
    <text x="210" y="200" fill="#fda4af" font-size="11" text-anchor="middle">(Acid béo no + không no có góc gập cis)</text>
  </g>

  <g transform="translate(420, 70)">
    <rect width="320" height="240" fill="#1e293b" rx="12" stroke="#ec4899" stroke-width="2"/>
    <text x="160" y="32" fill="#f472b6" font-size="16" font-weight="bold" text-anchor="middle" font-family="sans-serif">Khung Sterol (Cholesterol 27C)</text>
    <!-- Steran rings -->
    <rect x="50" y="90" width="45" height="45" fill="none" stroke="#e2e8f0" stroke-width="2.5"/>
    <text x="72" y="118" fill="#e2e8f0" font-size="14" font-weight="bold" text-anchor="middle">A</text>
    <rect x="95" y="90" width="45" height="45" fill="none" stroke="#e2e8f0" stroke-width="2.5"/>
    <text x="117" y="118" fill="#e2e8f0" font-size="14" font-weight="bold" text-anchor="middle">B</text>
    <rect x="95" y="45" width="45" height="45" fill="none" stroke="#e2e8f0" stroke-width="2.5"/>
    <text x="117" y="73" fill="#e2e8f0" font-size="14" font-weight="bold" text-anchor="middle">C</text>
    <polygon points="140,45 175,60 160,90 140,90" fill="none" stroke="#e2e8f0" stroke-width="2.5"/>
    <text x="152" y="73" fill="#e2e8f0" font-size="13" font-weight="bold" text-anchor="middle">D</text>
    <circle cx="50" cy="115" r="8" fill="#10b981"/>
    <text x="50" y="145" fill="#34d399" font-size="12" font-weight="bold" text-anchor="middle">3-OH</text>
    <text x="160" y="185" fill="#fbcfe8" font-size="12" text-anchor="middle">Tiền chất của:</text>
    <text x="160" y="210" fill="#fbcfe8" font-size="11" font-weight="bold" text-anchor="middle">Acid mật • Hormon Steroid • Vitamin D3</text>
  </g>
</svg>