<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%" height="100%">
  <rect width="800" height="360" fill="#0f172a" rx="16"/>
  <text x="400" y="36" fill="#38bdf8" font-size="20" font-weight="bold" text-anchor="middle" font-family="sans-serif">HÓA HỌC GLUCID: CẤU TRÚC MONOSACARID &amp; LIÊN KẾT GLYCOSID</text>
  
  <!-- D-Glucose ring -->
  <g transform="translate(60, 70)">
    <rect width="200" height="240" fill="#1e293b" rx="12" stroke="#3b82f6" stroke-width="2"/>
    <text x="100" y="30" fill="#60a5fa" font-size="15" font-weight="bold" text-anchor="middle" font-family="sans-serif">α-D-Glucopyranose</text>
    <polygon points="100,60 160,85 160,155 100,180 40,155 40,85" fill="none" stroke="#93c5fd" stroke-width="3"/>
    <text x="100" y="80" fill="#f8fafc" font-size="13" font-family="monospace" text-anchor="middle">O</text>
    <text x="175" y="125" fill="#34d399" font-size="12" font-weight="bold" font-family="sans-serif">C1 (Anomer)</text>
    <text x="100" y="215" fill="#fef08a" font-size="12" text-anchor="middle" font-family="sans-serif">OH C1 hướng DƯỚI (α)</text>
  </g>

  <!-- D-Galactose ring -->
  <g transform="translate(300, 70)">
    <rect width="200" height="240" fill="#1e293b" rx="12" stroke="#8b5cf6" stroke-width="2"/>
    <text x="100" y="30" fill="#a78bfa" font-size="15" font-weight="bold" text-anchor="middle" font-family="sans-serif">D-Galactose (Epimer C4)</text>
    <polygon points="100,60 160,85 160,155 100,180 40,155 40,85" fill="none" stroke="#c4b5fd" stroke-width="3"/>
    <text x="100" y="80" fill="#f8fafc" font-size="13" font-family="monospace" text-anchor="middle">O</text>
    <circle cx="40" cy="120" r="14" fill="#ef4444" opacity="0.3"/>
    <text x="35" y="125" fill="#fca5a5" font-size="12" font-weight="bold">C4</text>
    <text x="100" y="215" fill="#fbcfe8" font-size="12" text-anchor="middle" font-family="sans-serif">Khác Glucose tại OH ở C4</text>
  </g>

  <!-- Maltose bond -->
  <g transform="translate(540, 70)">
    <rect width="200" height="240" fill="#1e293b" rx="12" stroke="#10b981" stroke-width="2"/>
    <text x="100" y="30" fill="#34d399" font-size="15" font-weight="bold" text-anchor="middle" font-family="sans-serif">Liên Kết Glycosid</text>
    <path d="M 40,120 Q 100,80 160,120" fill="none" stroke="#fbbf24" stroke-width="4"/>
    <text x="100" y="110" fill="#fef08a" font-size="13" font-weight="bold" text-anchor="middle" font-family="sans-serif">α-1,4-Glycosid</text>
    <text x="100" y="150" fill="#e2e8f0" font-size="12" text-anchor="middle" font-family="sans-serif">Maltose: Glc (α-1,4) Glc</text>
    <text x="100" y="175" fill="#e2e8f0" font-size="12" text-anchor="middle" font-family="sans-serif">Lactose: Gal (β-1,4) Glc</text>
    <text x="100" y="200" fill="#f87171" font-size="12" font-weight="bold" text-anchor="middle" font-family="sans-serif">Sucrose: Glc (α1,β2) Fru</text>
    <text x="100" y="222" fill="#f87171" font-size="11" text-anchor="middle" font-family="sans-serif">(Mất tính khử hoàn toàn!)</text>
  </g>
</svg>