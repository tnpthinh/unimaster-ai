<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%" height="100%">
  <rect width="800" height="360" fill="#0f172a" rx="16"/>
  <text x="400" y="32" fill="#facc15" font-size="19" font-weight="bold" text-anchor="middle" font-family="sans-serif">CHUYỂN HÓA HEMOGLOBIN: CHU TRÌNH BILIRUBIN &amp; CHẨN ĐOÁN VÀNG DA</text>
  
  <g transform="translate(40, 60)">
    <!-- Step 1: Lách -->
    <rect x="0" y="20" width="210" height="110" fill="#1e293b" rx="10" stroke="#f43f5e" stroke-width="2"/>
    <text x="105" y="45" fill="#fb7185" font-size="14" font-weight="bold" text-anchor="middle">1. HỆ VÕNG NỘI MÔ (LÁCH)</text>
    <text x="105" y="70" fill="#e2e8f0" font-size="12" text-anchor="middle">Hồng cầu già (120 ngày) vỡ</text>
    <text x="105" y="90" fill="#fef08a" font-size="12" font-weight="bold" text-anchor="middle">Hem → Biliverdin →</text>
    <text x="105" y="112" fill="#f43f5e" font-size="13" font-weight="bold" text-anchor="middle">Bilirubin Gián Tiếp (Tự do)</text>

    <!-- Arrow to Liver -->
    <path d="M 210,75 L 260,75" stroke="#facc15" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="235" y="65" fill="#fef08a" font-size="10" text-anchor="middle">+ Albumin</text>

    <!-- Step 2: Gan -->
    <rect x="270" y="10" width="230" height="130" fill="#1e293b" rx="10" stroke="#10b981" stroke-width="2"/>
    <text x="385" y="35" fill="#34d399" font-size="14" font-weight="bold" text-anchor="middle">2. TẾ BÀO GAN</text>
    <text x="385" y="60" fill="#94a3b8" font-size="11" text-anchor="middle">Bắt giữ &amp; Liên hợp với</text>
    <text x="385" y="80" fill="#94a3b8" font-size="12" font-weight="bold" text-anchor="middle">2 Acid Glucuronic (UGT1A1)</text>
    <text x="385" y="105" fill="#10b981" font-size="13" font-weight="bold" text-anchor="middle">Bilirubin Trực Tiếp (Liên hợp)</text>
    <text x="385" y="125" fill="#a7f3d0" font-size="11" text-anchor="middle">(Tan trong nước, không độc)</text>

    <!-- Step 3: Ruột & Thận -->
    <rect x="530" y="20" width="210" height="110" fill="#1e293b" rx="10" stroke="#38bdf8" stroke-width="2"/>
    <text x="635" y="45" fill="#38bdf8" font-size="14" font-weight="bold" text-anchor="middle">3. RUỘT &amp; THẢI TRỪ</text>
    <text x="635" y="70" fill="#e2e8f0" font-size="12" text-anchor="middle">Vi khuẩn ruột khử thành:</text>
    <text x="635" y="92" fill="#fbbf24" font-size="12" font-weight="bold" text-anchor="middle">Stercobilin (vàng phân)</text>
    <text x="635" y="112" fill="#fde047" font-size="12" font-weight="bold" text-anchor="middle">Urobilin (vàng nước tiểu)</text>

    <!-- Clinical Jaundice Guide Table -->
    <g transform="translate(0, 160)">
      <rect width="740" height="115" fill="#111827" rx="10" stroke="#475569" stroke-width="1.5"/>
      <text x="370" y="25" fill="#f8fafc" font-size="13" font-weight="bold" text-anchor="middle">BẢNG PHÂN LOẠI VÀNG DA LÂM SÀNG</text>
      <text x="120" y="55" fill="#fb7185" font-size="12" font-weight="bold" text-anchor="middle">Vàng da Trước gan (Tán huyết):</text>
      <text x="120" y="75" fill="#cbd5e1" font-size="11" text-anchor="middle">Bilirubin Gián tiếp tăng vọt</text>
      <text x="120" y="95" fill="#cbd5e1" font-size="11" text-anchor="middle">Nước tiểu KHÔNG có sắc tố mật</text>

      <text x="370" y="55" fill="#a78bfa" font-size="12" font-weight="bold" text-anchor="middle">Vàng da Tại gan (Viêm gan/Xơ gan):</text>
      <text x="370" y="75" fill="#cbd5e1" font-size="11" text-anchor="middle">Tăng cả Trực tiếp &amp; Gián tiếp</text>
      <text x="370" y="95" fill="#cbd5e1" font-size="11" text-anchor="middle">AST, ALT tăng rất cao</text>

      <text x="620" y="55" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle">Vàng da Sau gan (Tắc mật):</text>
      <text x="620" y="75" fill="#cbd5e1" font-size="11" text-anchor="middle">Bilirubin Trực tiếp tăng cao</text>
      <text x="620" y="95" fill="#cbd5e1" font-size="11" text-anchor="middle">Phân bạc màu, nước tiểu sẫm</text>
    </g>
  </g>
</svg>