# Render Blueprint — New + > Blueprint > chọn repo GitHub chứa thư mục này
services:
  - type: web
    name: unimaster-ai
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: APP_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: DATA_DIR
        value: /tmp/unimaster-data
