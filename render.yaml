# Render Blueprint — New + > Blueprint > chọn repo GitHub tnpthinh/unimaster-ai
services:
  - type: web
    name: unimaster-ai
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: APP_PASSWORD
        sync: false
      - key: GEMINI_API_KEYS
        sync: false
      - key: REQUIRE_AUTH
        value: "1"
      - key: SESSION_SECRET
        generateValue: true
      - key: DATA_DIR
        value: /tmp/unimaster-data
      - key: AI_PROVIDER_PRIORITY
        value: gemini_first
      # (Tùy chọn sau khi deploy) Có thể thêm ROUTER_BASE_URL, ROUTER_API_KEY, ROUTER_MODEL,
      # hoặc TELEGRAM_BOT_TOKEN + TELEGRAM_BACKUP_CHAT_ID trong Render Dashboard > Environment
